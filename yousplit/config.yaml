name: YouSplit
version: "1.0.0"
slug: yousplit
description: Gemeinsame Ausgaben aufteilen (Kassensturz) - lokal und privacy-first
url: https://github.com/car-mechanic/YouSplit
arch:
  - amd64
  - aarch64
# init (tini) bleibt an: leitet SIGTERM an run.py weiter und raeumt Zombie-
# Prozesse von Postgres ab (kein s6-Basis-Image)
startup: application
boot: auto
# Fertiges Image aus der GitHub Action (.github/workflows/addon-image.yml)
image: ghcr.io/car-mechanic/yousplit-addon-{arch}
# Kein Ingress: Der Share-Link der App muss ohne Home-Assistant-Login
# funktionieren, daher direkter Port (z. B. hinter Cloudflare-Tunnel/Proxy).
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: YouSplit Weboberflaeche
webui: "http://[HOST]:[PORT:8099]"
watchdog: "tcp://[HOST]:[PORT:8099]"
# Postgres-Dateien in /data sind nur bei gestopptem Server konsistent:
# Home Assistant haelt das Add-on fuer die Dauer des Backups an.
backup: cold
options:
  log_level: INFO
schema:
  log_level: list(DEBUG|INFO|WARNING|ERROR)
