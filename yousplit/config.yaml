name: YouSplit
version: "1.3.0"
slug: yousplit
description: Gemeinsame Ausgaben aufteilen (Kassensturz) - lokal und privacy-first
url: https://github.com/car-mechanic/YouSplit
arch:
  - amd64
  - aarch64
# init (tini) bleibt an: leitet SIGTERM an run.py weiter und raeumt Zombie-
# Prozesse von Postgres ab (kein s6-Basis-Image)
startup: application
boot: auto
# Fertiges Image aus der GitHub Action (.github/workflows/addon-image.yml)
image: ghcr.io/car-mechanic/yousplit-addon-{arch}
# Ingress: Oberflaeche in Home Assistant samt Sidebar-Schalter. Der direkte
# Port bleibt zusaetzlich offen: Share-Links muessen ohne HA-Login
# funktionieren (z. B. hinter Cloudflare-Tunnel/Proxy, siehe public_url).
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-multiple
panel_title: YouSplit
# Alle HA-Benutzer sehen YouSplit in der Seitenleiste, nicht nur Admins: Listen
# werden mit HA-Benutzern geteilt.
panel_admin: false
# Benutzerliste fuer die Personen-Auswahl (Websocket config/auth/list, ha_users.py)
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: YouSplit Weboberflaeche (Share-Links)
watchdog: "tcp://[HOST]:[PORT:8099]"
# Postgres-Dateien in /data sind nur bei gestopptem Server konsistent:
# Home Assistant haelt das Add-on fuer die Dauer des Backups an.
backup: cold
options:
  log_level: INFO
schema:
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  public_url: url?
