# GPU-Override fuer den Ollama-Dienst (optional).
#
# Reserviert dem Ollama-Container eine NVIDIA-GPU. Diese Datei wird NUR ZUSAETZLICH
# zur Basis-`docker-compose.yml` verwendet und niemals allein.
#
# Voraussetzung auf dem Host: NVIDIA-GPU + NVIDIA Container Toolkit (nvidia-smi
# laeuft, `docker info` zeigt die "nvidia" Runtime).
#
# Aktivieren – zwei Wege:
#   a) Dauerhaft ueber die `.env`: dort `COMPOSE_FILE` auf beide Dateien setzen
#      (siehe .env, eine Zeile ent-/kommentieren).
#   b) Ad hoc pro Aufruf:
#        docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# WICHTIG: Diese Datei NICHT als Default aktivieren. Fehlt auf dem Host eine GPU
# oder die NVIDIA-Runtime, bricht der Ollama-Container-Start hiermit ab. Der
# sichere Default ist deshalb CPU (Basis-Compose ohne dieses Override) — siehe .env.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
