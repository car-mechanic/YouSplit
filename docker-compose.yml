services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yousplit
      POSTGRES_PASSWORD: yousplit
      POSTGRES_DB: yousplit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yousplit"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    # Laeuft hier bewusst auf der CPU — dieser sichere Default startet auf JEDEM
    # Host. Fuer NVIDIA-GPU-Beschleunigung das Override `docker-compose.gpu.yml`
    # dazuschalten (siehe .env / COMPOSE_FILE). Ohne GPU einfach nichts tun.
    image: ollama/ollama:latest
    environment:
      # Ressourcen-Schonung (Roadmap 4.0 #1): Modell schon nach 1 Minute
      # Inaktivitaet wieder aus dem RAM werfen (~4 GB) — wichtig auf einem
      # kleinen Server. Kehrseite: der naechste Scan nach einer Pause laedt das
      # Modell erst neu (dauert wieder minutenlang). Passt zur asynchronen
      # "Fire & Forget"-Verarbeitung, bei der niemand mehr aktiv wartet.
      OLLAMA_KEEP_ALIVE: 1m
    volumes:
      # Modelle ueberleben Container-Neustarts (qwen3.5:2b ist ~2,7 GB)
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://yousplit:yousplit@db:5432/yousplit
      OLLAMA_URL: http://ollama:11434
      # llama3.2-vision (mllama) wird von aktuellen Ollama-Versionen nicht
      # mehr unterstuetzt. Seit 2026-10-02 Test mit qwen3.5:2b (Vision, OCR);
      # Alternativen: qwen3.5:4b (genauer, ~3,4 GB) oder qwen2.5vl:3b (vorher).
      # Qwen3.5 braucht eine aktuelle Ollama-Version (`docker compose pull ollama`).
      OLLAMA_MODEL: qwen3.5:2b
      # CPU-Inferenz eines Bons dauert 2-4 Minuten — grosszuegig warten
      OLLAMA_TIMEOUT_SECONDS: "480"
      # Log-Level des Backends (DEBUG zeigt z. B. auch rohe KI-Antworten)
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymes Volume: node_modules aus dem Image behalten,
      # nicht vom (Windows-)Host ueberschreiben lassen
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_models:
