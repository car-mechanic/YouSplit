services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yousplit
      POSTGRES_PASSWORD: yousplit
      POSTGRES_DB: yousplit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yousplit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://yousplit:yousplit@db:5432/yousplit
      # Log-Level des Backends
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymes Volume: node_modules aus dem Image behalten,
      # nicht vom (Windows-)Host ueberschreiben lassen
      - /app/node_modules
    depends_on:
      - backend

  # Cloudflare-Tunnel: macht das Frontend ueber eine eigene Domain per HTTPS
  # erreichbar, ohne Portfreigabe im Router. Laeuft nur mit Profil "tunnel"
  # (auf dem Server in .env: COMPOSE_PROFILES=tunnel), damit er lokal beim
  # Entwickeln nicht ohne Token in einer Neustart-Schleife haengt.
  # Ziel im Cloudflare-Dashboard (Public Hostname): http://frontend:5173
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - frontend

volumes:
  postgres_data:
